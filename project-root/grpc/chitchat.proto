syntax = "proto3";
option go_package = "chitchat/grpc";
package chitchat;


service ChitChat {
	rpc Join(JoinRequest) returns (stream BroadcastMessage); //stream
	rpc Publish(ChatMessage) returns (PublishResponse);
    rpc Leave(LeaveRequest) returns (LeaveResponse);
}

message JoinRequest {
    string name = 1;
}

message BroadcastMessage {
    string content = 1;
    int64 timestamp = 2;
}

message ChatMessage {
    string name = 1;
    string content = 2;
    int64 timestamp = 3;
} 

message LeaveRequest {
    string name = 1;
    int64 timestamp = 2;
}

message PublishResponse{}

message LeaveResponse{}